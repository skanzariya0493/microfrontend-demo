version: "3.8"

services:
  shell:
    build:
      context: ./shell
    container_name: shell
    ports:
      - "4200:4200"
    depends_on:
      - backend

  product:
    build:
      context: ./product
    container_name: product 
    ports:
      - "4201:4201"
    depends_on:
      - backend

  order:
    build:
      context: ./order
    container_name: order
    ports:
      - "4202:4202"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped