name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ['.', 'backend', 'shell', 'product', 'order']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, Test and Build (per package)
        shell: bash
        run: |
          set -e
          DIR=${{ matrix.dir }}
          echo "Processing $DIR"

          # Normalize directory for root
          if [ "$DIR" = "." ]; then
            PKG=package.json
          else
            PKG="$DIR/package.json"
          fi

          if [ ! -f "$PKG" ]; then
            echo "No package.json in $DIR, skipping"
            exit 0
          fi

          pushd "${DIR}" >/dev/null

          echo "Installing dependencies in ${DIR}"
          npm ci

          echo "Running tests in ${DIR}"
          set +e
          npm test
          TEST_EXIT=$?
          set -e

          if [ $TEST_EXIT -ne 0 ]; then
            echo "Tests failed in ${DIR} (exit $TEST_EXIT)"
            exit $TEST_EXIT
          fi

          # Run build if script exists
          if npm run | grep -q "build"; then
            echo "Building ${DIR}"
            npm run build
          else
            echo "No build script in ${DIR}, skipping build"
          fi

          popd >/dev/null